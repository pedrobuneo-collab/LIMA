<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exemplo de uso de CSS Interno em uma página HTML.">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>CSS_Interno</title>

    <style>
        body {
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            background-color: #77c7df;
            margin: 0;
            padding: 20px;
            font-size: 30px;
        }

        h1 {
            color: blue;
            background-color: blueviolet;
            text-align: center;
            padding: 10px;
        }

        p {
            color: #ff0000;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div>
        <h1>Exemplo de CSS Interno</h1>

        <p>
            Este é um exemplo de como aplicar CSS Interno em uma página HTML.
            O CSS Interno é definido dentro da tag &lt;style&gt; no cabeçalho do documento.
        </p>
    </div>
</body>
</html>
